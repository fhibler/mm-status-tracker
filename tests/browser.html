<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Engine tests (browser)</title>
  <style>
    body { font: 14px/1.5 system-ui, sans-serif; margin: 24px; }
    #result { font-size: 18px; font-weight: 700; }
    .pass { color: #15703a; } .fail { color: #c8102e; }
    pre { background: #f4f5f8; padding: 12px; border-radius: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <h1>Engine tests</h1>
  <p>Runs <code>tests/engine.test.js</code> without Node: <code>vm</code> contexts are iframes (separate realms, like Node),
    and <code>assert.deepStrictEqual</code> compares prototypes like Node does. Serve the project root
    (<code>tools/serve.ps1</code>) and open <code>/tests/browser.html</code>. CI runs the same file with Node.</p>
  <p id="result">Running…</p>
  <pre id="log"></pre>
  <script>
    (() => {
      const get = (p) => {
        const x = new XMLHttpRequest();
        x.open('GET', '../' + p.replace(/^.*?(js|tests)\//, '$1/') + '?t=' + Date.now(), false);
        x.send();
        if (x.status !== 200) throw new Error('HTTP ' + x.status + ' for ' + p);
        return x.responseText;
      };
      const deep = (a, b, path = '') => {
        if (Object.is(a, b)) return;
        if (typeof a !== 'object' || typeof b !== 'object' || !a || !b) throw new Error(`deepStrictEqual ${path}: ${JSON.stringify(a)} !== ${JSON.stringify(b)}`);
        if (Object.getPrototypeOf(a) !== Object.getPrototypeOf(b)) throw new Error(`deepStrictEqual ${path}: prototypes differ (value from another realm)`);
        const ka = Object.keys(a), kb = Object.keys(b);
        if (ka.length !== kb.length) throw new Error(`deepStrictEqual ${path}: different keys`);
        for (const k of ka) deep(a[k], b[k], path + '.' + k);
      };
      const fail = (m) => { throw new Error(m); };
      const assert = Object.assign((v, m) => v || fail('assert ' + (m || '')), {
        ok: (v, m) => v || fail('ok ' + (m || '')),
        strictEqual: (a, b) => Object.is(a, b) || fail(`strictEqual: ${JSON.stringify(a)} !== ${JSON.stringify(b)}`),
        deepStrictEqual: (a, b) => deep(a, b),
      });
      const vm = {
        createContext: (ctx) => {
          const f = document.createElement('iframe');
          f.style.display = 'none';
          document.body.appendChild(f);
          ctx.__win = f.contentWindow;
          return ctx;
        },
        runInContext: (code, ctx) => { ctx.__win.console = console; ctx.__win.eval(code); ctx.MM = ctx.__win.MM; },
      };
      const require = (n) => ({ fs: { readFileSync: (p) => get(p) }, path: { join: (...a) => a.join('/') }, vm, assert }[n]);
      const log = [];
      const result = document.getElementById('result');
      try {
        new Function('require', '__dirname', 'console', get('tests/engine.test.js'))(require, 'tests', { log: (m) => log.push(m) });
        result.textContent = 'PASS';
        result.className = 'pass';
      } catch (e) {
        result.textContent = 'FAIL – ' + e.message;
        result.className = 'fail';
        log.push(e.stack || String(e));
      }
      document.getElementById('log').textContent = log.join('\n');
    })();
  </script>
</body>
</html>
