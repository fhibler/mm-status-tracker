name: Deploy to GitHub Pages

on:
  push:            # every branch is tested; only main is deployed
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 3 * * 1'   # weekly redeploy with fresh OurAirports data

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    concurrency:
      group: build-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Download OurAirports data
        run: curl -sSfL --retry 3 -o "$RUNNER_TEMP/airports.csv" https://davidmegginson.github.io/ourairports-data/airports.csv

      - name: Build airport table (js/airports.js)
        shell: pwsh
        run: ./tools/build-airports.ps1 -Csv "$env:RUNNER_TEMP/airports.csv"

      - name: Check JavaScript syntax
        run: for f in js/*.js; do node --check "$f"; done

      - name: Run engine tests
        run: node tests/engine.test.js

      - name: Assemble site
        run: |
          mkdir -p _site
          cp -r index.html css js _site/
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: _site

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false   # never stop a deployment halfway
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
